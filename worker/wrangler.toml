# Asistente Rumi (Cloudflare Worker). Publicar: npm run worker:deploy
# La clave de Gemini NO va aquí: npx wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml
name = "rumi-ia"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Límite de uso por IP: 10 consultas por minuto.
[[ratelimits]]
name = "LIMITADOR"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
